references:
  - external_access_reference:
      label: "iLevel Access Integration"
      description: "This External Access Integration is required to access the iLevel API"
      privileges:
        - USAGE
      object_type: EXTERNAL ACCESS INTEGRATION
      register_callback: PUBLIC.REGISTER_REFERENCE ###CHAHGED 
      configuration_callback: public.get_configuration  ### CHAHGED

