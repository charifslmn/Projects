manifest_version: 1

artifacts:
  setup_script: setup.sql
  extension_code: true
  default_streamlit: public."Configuration"

version:
  name: V_2
  comment: "Build info {version: V_2, patch: 0}"

configuration:
  log_level: DEBUG
  trace_level: ON_EVENT

privileges:
  - EXECUTE TASK:
      description: "Permission to run ingestion tasks"
  - CREATE DATABASE:
      description: "Create database for ingestion"
  - IMPORTED PRIVILEGES ON SNOWFLAKE DB:
      description: "Permission to import privileges on snowflake database"

